<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.05); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cardFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes cardFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }
    .floating-cloud { animation: floatSlow 7s ease-in-out infinite; }
    .pulsing-glow { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
    .data-flow { stroke-dasharray: 8 6; animation: flowLine 15s linear infinite; }
    .card-1 { animation: cardFloat1 6s ease-in-out infinite; }
    .card-2 { animation: cardFloat2 5s ease-in-out infinite; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/>

  <!-- Background Cyber Circuit Grid / Dots -->
  <g opacity="0.12">
    <circle cx="100" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="200" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="300" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="400" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="500" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="600" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="700" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="800" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="900" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="1000" cy="60" r="1.5" fill="#38bdf8"/>
    <circle cx="1100" cy="60" r="1.5" fill="#38bdf8"/>
    
    <circle cx="100" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="200" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="300" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="400" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="500" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="600" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="700" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="800" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="900" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="1000" cy="180" r="1.5" fill="#38bdf8"/>
    <circle cx="1100" cy="180" r="1.5" fill="#38bdf8"/>

    <circle cx="100" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="200" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="300" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="400" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="500" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="600" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="700" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="800" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="900" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="1000" cy="300" r="1.5" fill="#38bdf8"/>
    <circle cx="1100" cy="300" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Ambient Glow Elements in Background -->
  <circle cx="960" cy="160" r="130" fill="#38bdf8" class="pulsing-glow" filter="url(#glow)"/>
  <circle cx="200" cy="220" r="100" fill="#818cf8" opacity="0.15" filter="url(#glow)"/>

  <!-- Network / Backup Connection Line -->
  <path d="M 500,290 C 720,290 850,230 960,180" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" class="data-flow" opacity="0.6"/>

  <!-- Dynamic Side Graphic: Cloud & macOS Protection Shield (Right Side) -->
  <g class="floating-cloud" transform="translate(860, 50)">
    <!-- Cloud Silhouette -->
    <path d="M70,120 Q50,120 40,105 Q30,90 40,70 Q50,55 70,55 Q80,30 110,25 Q145,20 165,45 Q185,35 210,48 Q230,60 230,85 Q250,90 255,108 Q260,125 240,140 Q225,145 200,145 L70,145 Z" 
          fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="2" opacity="0.4" filter="url(#shadow)"/>
    
    <!-- Shield / macOS Security Icon -->
    <g transform="translate(100, 75)" filter="url(#shadow)">
      <path d="M45,0 L85,16 C85,60 45,85 45,85 C45,85 5,60 5,16 Z" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="3"/>
      <!-- Apple Shape Outline Inside Shield -->
      <path d="M45,30 C48,27 52,28 52,28 C50,33 46,34 45,34 C44,34 40,33 38,28 C41,28 44,30 45,30 Z M37,35 C40,35 43,37 45,37 C47,37 50,35 53,35 C58,35 62,39 62,45 C62,54 53,63 45,63 C37,63 28,54 28,45 C28,39 32,35 37,35 Z" fill="#38bdf8"/>
      <!-- Checkmark -->
      <path d="M38,47 L43,52 L53,41" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Interactive Floating Status Cards (Right Foreground) -->
  <g class="card-1" transform="translate(800, 210)" filter="url(#shadow)">
    <rect width="180" height="60" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="28" cy="30" r="12" fill="#0284c7" opacity="0.3"/>
    <text x="28" y="35" font-size="14" text-anchor="middle" fill="#38bdf8">☁️</text>
    <text x="50" y="27" fill="#f8fafc" font-size="12" class="badge-text">Encrypted Sync</text>
    <text x="50" y="44" fill="#94a3b8" font-size="10" class="subtitle-text">Zero-Knowledge AES</text>
  </g>

  <g class="card-2" transform="translate(990, 110)" filter="url(#shadow)">
    <rect width="170" height="58" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="28" cy="29" r="12" fill="#7e22ce" opacity="0.3"/>
    <text x="28" y="34" font-size="14" text-anchor="middle" fill="#c084fc">🛡️</text>
    <text x="50" y="26" fill="#f8fafc" font-size="12" class="badge-text">Ransomware Guard</text>
    <text x="50" y="43" fill="#94a3b8" font-size="10" class="subtitle-text">Real-Time Protection</text>
  </g>

  <!-- Header Category Pill / Tag (Left Foreground) -->
  <g transform="translate(60, 48)">
    <rect width="270" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9"/>
    <circle cx="16" cy="16" r="6" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="21" fill="#38bdf8" font-size="12" letter-spacing="1.5" class="badge-text">ENTERPRISE &amp; OPEN SOURCE</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 135)">
    <text class="title-text" font-size="38" fill="#ffffff" letter-spacing="-0.5">
      macOS Device Cloud Protection
    </text>
    <text class="title-text" y="50" font-size="38" fill="url(#primaryGrad)" letter-spacing="-0.5">
      &amp; Cloud Backup Solutions
    </text>
    <text class="subtitle-text" y="92" font-size="15" fill="#94a3b8" letter-spacing="0.2">
      Curated fleet backup, endpoint threat detection, zero-knowledge sync &amp; disaster recovery.
    </text>
  </g>

  <!-- Feature Highlights / Pills (Left Bottom Foreground) -->
  <g transform="translate(60, 275)">
    <!-- Pill 1 -->
    <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="22" font-size="13" fill="#38bdf8">💻</text>
    <text x="38" y="22" font-size="12" fill="#e2e8f0" class="badge-text">Mac Endpoints</text>

    <!-- Pill 2 -->
    <g transform="translate(145, 0)">
      <rect width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" font-size="13" fill="#818cf8">☁️</text>
      <text x="38" y="22" font-size="12" fill="#e2e8f0" class="badge-text">Cloud &amp; Offsite</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(305, 0)">
      <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" font-size="13" fill="#c084fc">🔒</text>
      <text x="38" y="22" font-size="12" fill="#e2e8f0" class="badge-text">Zero-Trust &amp; EDR</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(480, 0)">
      <rect width="155" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" font-size="13" fill="#22c55e">⭐</text>
      <text x="38" y="22" font-size="12" fill="#e2e8f0" class="badge-text">Awesome Stack</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#primaryGrad)"/>
</svg>
